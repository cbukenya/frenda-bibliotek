name: Migration Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/FrendaBibliotek.Api/Data/Migrations/**'
      - 'backend/FrendaBibliotek.Api/Models/**'
      - 'backend/FrendaBibliotek.Api/Data/AppDbContext.cs'

jobs:
  check-single-migration:
    name: Enforce single migration per PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count migrations
        id: count
        run: |
          COUNT=$(find backend/FrendaBibliotek.Api/Data/Migrations \
            -maxdepth 1 -name "*_*.cs" ! -name "*.Designer.cs" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Migration count: $COUNT"

      - name: Fail if more than one migration
        if: steps.count.outputs.count > 1
        run: |
          echo "This PR contains ${{ steps.count.outputs.count }} migrations."
          echo "Please squash them into one by running ./reset-migrations.sh before merging."
          exit 1
